# ============================================================
#  sites.conf — Per-website configuration
#  One block per site. Keys: site.<domain>.<field>=<value>
#  After adding/changing, the server hot-reloads via /_api/internal/reload
# ============================================================

# ── Field reference ───────────────────────────────────────────
# fe_folder   : path to FE source tree (built on spinup)
# be_folder   : path to BE source tree (containerised)
# user        : owner username
# domain      : public domain name (used for routing + K8s namespace)
# be_type     : node | python | go | java | php | static
# run_cmd     : command to start the BE inside the container
# be_port     : port the BE listens on inside the container
# fe_build    : npm | vite | next | hugo | none  (none = bare HTML copy)
# db_count    : number of DB containers for this site
#
# Per-DB fields (index 0-based):
# db.<N>.name      : logical alias
# db.<N>.type      : postgres | mysql | mongo | redis
# db.<N>.db_name   : database/schema name
# (credentials are entered in the admin UI and stored in K8s Secrets)
# ──────────────────────────────────────────────────────────────

# Example site — remove or replace before production
site.example.com.fe_folder=./sites/example.com/src
site.example.com.be_folder=./sites/example.com/backend
site.example.com.user=admin
site.example.com.domain=example.com
site.example.com.be_type=node
site.example.com.run_cmd=node index.js
site.example.com.be_port=3000
site.example.com.fe_build=npm
site.example.com.db_count=1

site.example.com.db.0.name=main_db
site.example.com.db.0.type=postgres
site.example.com.db.0.db_name=example_db
