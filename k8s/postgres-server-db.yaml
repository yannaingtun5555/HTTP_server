---
apiVersion: v1
kind: Namespace
metadata:
  name: server-system

---
apiVersion: v1
kind: Secret
metadata:
  name: pg-server-secret
  namespace: server-system
type: Opaque
data:
  # base64 of 'changeme'
  POSTGRES_PASSWORD: Y2hhbmdlbWU=

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-server-config
  namespace: server-system
data:
  POSTGRES_DB: server_db
  POSTGRES_USER: admin

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-server
  namespace: server-system
spec:
  serviceName: pg-server
  replicas: 1
  selector:
    matchLabels:
      app: pg-server
  template:
    metadata:
      labels:
        app: pg-server
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: pg-server-config
            - secretRef:
                name: pg-server-secret
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "admin", "-d", "server_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "admin", "-d", "server_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: pg-server
  namespace: server-system
spec:
  type: ClusterIP
  selector:
    app: pg-server
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
