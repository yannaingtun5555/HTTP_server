# ============================================================
#  server.conf — C++ HTTP Server configuration (server only)
#  DO NOT put site/domain settings here; use sites.conf
# ============================================================

# ── Network ──────────────────────────────────────────────────
server_host=0.0.0.0
server_port=8000

# ── Performance ───────────────────────────────────────────────
# 0 = auto-detect (hardware_concurrency)
thread_pool_size=0

# ── Proxy timeouts (seconds) ──────────────────────────────────
backend_connect_timeout=5
backend_response_timeout=10

# ── Static sites root ─────────────────────────────────────────
# Built FE files land in: <sites_root>/<domain>/public/
sites_root=./sites

# ── Server-side PostgreSQL (sidecar) ──────────────────────────
server_db_host=127.0.0.1
server_db_port=5432
server_db_name=server_db
server_db_user=admin
server_db_password=changeme

# ── Admin panel (Django — always-on K8s pod) ──────────────────
admin_backend_host=127.0.0.1
admin_backend_port=8080
admin_backend_path_prefix=/_admin

# ── Internal API (served by C++ server itself) ────────────────
internal_api_path_prefix=/_api/internal
internal_api_secret=changeme-secret

# ── Kubernetes ────────────────────────────────────────────────
# Path to kubeconfig file; leave empty to use in-cluster service account
k8s_kubeconfig=/etc/kubernetes/admin.conf
# K8s API server endpoint (overrides kubeconfig if set)
k8s_api_server=https://127.0.0.1:6443
