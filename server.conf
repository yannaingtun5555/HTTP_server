# Network Interface
server_host=0.0.0.0
server_port=8000

# Performance
thread_pool_size=4

# Proxy timeouts
backend_connect_timeout=30
backend_response_timeout=60

# Sites storage directory
sites_root=./sites

# PostgreSQL Master Database (Docker container pg_server_db)
server_db_host=127.0.0.1
server_db_port=5432
server_db_name=server_db
server_db_user=admin
server_db_password=changeme

# Admin Control Panel (Django Gunicorn process)
admin_backend_host=127.0.0.1
admin_backend_port=8080
admin_backend_path_prefix=/_admin

# Internal API
internal_api_path_prefix=/_api/internal
internal_api_secret=changeme-secret

# Kubernetes Cluster
k8s_kubeconfig=/home/yan9htun/.kube/config
k8s_api_server=https://127.0.0.1:6443